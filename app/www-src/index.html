<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Open Chambers</title>
<style>
  :root { --bg:#F7F6F2; --surface:#fff; --surface-2:#EFEDE7; --ink:#1A1D21; --ink-2:#4A4F57; --ink-3:#7C818A; --line:#E4E2DB; --accent:#1F3A5F; --accent-soft:#E4EAF2; --dem:#3B6FB6; --rep:#C4423A; --ind:#6B8E23; --yea:#2E7D4F; --nay:#B23A3A; --nv:#A5A9B0; --green:#34C759;
    --serif:"New York","Newsreader",Georgia,serif; --sans:-apple-system,"SF Pro Text","Public Sans","Helvetica Neue",Arial,sans-serif; --mono:"SF Mono",Menlo,monospace; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px) }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171B; --surface:#1C2026; --surface-2:#242930; --ink:#ECEEF1; --ink-2:#B4B9C1; --ink-3:#7C818A; --line:#2C323A; --accent:#8FB3E0; --accent-soft:#1E2A3A; --dem:#6D9BDC; --rep:#E06A62; --ind:#9BBF4A; --yea:#5BB47F; --nay:#E07070; --nv:#6C7079 } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased; -webkit-user-select:none; user-select:none; overscroll-behavior:none }
  a { color:var(--accent); text-decoration:none }
  #app { position:fixed; inset:0; display:flex; flex-direction:column }
  .view { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:calc(10px + var(--safe-t)) 16px 24px }
  .h { font-family:var(--serif); font-weight:600; font-size:28px; line-height:1.1; letter-spacing:-.01em; margin:10px 0 6px }
  .sub { color:var(--ink-2); font-size:15px; margin:0 0 16px }
  .eyebrow { font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin:18px 0 8px }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:13px 14px; margin-bottom:10px }
  .btn { display:block; width:100%; text-align:center; background:var(--accent); color:#fff; font-weight:600; font-size:17px; padding:15px; border-radius:14px; border:0; font-family:inherit }
  .btn.ghost { background:transparent; color:var(--accent); border:1px solid var(--line) }
  .btn:disabled { opacity:.5 }
  input.zip { width:100%; font:inherit; font-family:var(--mono); font-size:24px; letter-spacing:.12em; padding:14px 16px; border:1.5px solid var(--line); border-radius:14px; background:var(--surface); color:var(--ink); margin-bottom:12px }
  .row { display:flex; align-items:center; gap:12px }
  .avatar { width:44px; height:54px; border-radius:9px; object-fit:cover; background:var(--surface-2); flex:0 0 auto }
  .avatar.sm { width:32px; height:39px; border-radius:7px }
  .initials { display:grid; place-items:center; font-family:var(--serif); font-size:16px; color:var(--ink-3) }
  .name { font-family:var(--serif); font-weight:600; font-size:17px; line-height:1.15 }
  .meta { font-size:13px; color:var(--ink-2) }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px } .D { background:var(--dem) } .R { background:var(--rep) } .I { background:var(--ind) }
  .toggle { width:51px; height:31px; border-radius:16px; background:#D9D9DE; position:relative; flex:0 0 auto; margin-left:auto; border:0; padding:0; transition:background .15s } .toggle::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.25); transition:transform .15s } .toggle.on { background:var(--green) } .toggle.on::after { transform:translateX(20px) }
  .tag { display:inline-block; font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:6px; background:var(--surface-2); color:var(--ink-2) } .tag.yea { background:color-mix(in srgb,var(--yea) 16%,transparent); color:var(--yea) } .tag.nay { background:color-mix(in srgb,var(--nay) 16%,transparent); color:var(--nay) }
  .bar { height:8px; border-radius:4px; overflow:hidden; display:flex; background:var(--surface-2); margin-top:8px } .bar i { display:block; height:100% }
  .seg { display:flex; background:var(--surface-2); border-radius:10px; padding:3px } .seg button { flex:1; font:inherit; font-size:14px; font-weight:500; padding:8px; border:0; border-radius:8px; background:transparent; color:var(--ink-2) } .seg button.on { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08) }
  .vote { padding:12px 0; border-bottom:1px solid var(--line) } .vote:last-child { border:0 } .vote .q { font-weight:600; font-size:15px } .vote .d { color:var(--ink-2); font-size:14px; margin-top:2px } .vote .m { font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-top:4px }
  .summary { background:var(--accent-soft); border-radius:14px; padding:12px 14px; font-size:15px } .summary .src { font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin-bottom:6px }
  .setting { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); font-size:16px } .setting:last-child { border:0 } .setting small { display:block; color:var(--ink-3); font-size:13px }
  .tabbar { display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--line); background:var(--surface); padding:8px 0 calc(8px + var(--safe-b)); font-size:10.5px; text-align:center; color:var(--ink-3) } .tabbar button { font:inherit; font-size:inherit; color:inherit; background:none; border:0; padding:0 } .tabbar button.on { color:var(--accent) } 
  .tabbar svg { display:block; width:26px; height:26px; margin:0 auto 3px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round }
  .empty { color:var(--ink-3); padding:28px 12px; text-align:center; border:1px dashed var(--line); border-radius:14px; font-size:15px }
  .back { font-size:16px; font-weight:600; color:var(--accent); margin:6px 0 2px; display:inline-block }
  .prow { display:flex; align-items:center; gap:8px; white-space:nowrap; font-size:13px; margin-top:6px } .prow .lab { width:96px } .prow .bar { flex:1; margin:0 } .prow .n { font-family:var(--mono); font-size:12px; width:52px; text-align:right; color:var(--ink-2) }
  .note { font-size:13.5px; color:var(--ink-2); background:var(--surface-2); border-radius:12px; padding:10px 12px }
  .chip { display:inline-block; margin:3px 8px 3px 0; font-size:14px }
</style>
</head>
<body>
<div id="app"><div class="view"><div class="empty">Loading…</div></div></div>
<script src="native.js"></script>

<script>
/* ===================== config + state ===================== */
const DATA = "https://johnhubert.llc/floor/data/";
const API = "https://api.johnhubert.llc";
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const STATES = { AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",CT:"Connecticut",DE:"Delaware",FL:"Florida",GA:"Georgia",HI:"Hawaii",ID:"Idaho",IL:"Illinois",IN:"Indiana",IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",ME:"Maine",MD:"Maryland",MA:"Massachusetts",MI:"Michigan",MN:"Minnesota",MS:"Mississippi",MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",NH:"New Hampshire",NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",ND:"North Dakota",OH:"Ohio",OK:"Oklahoma",OR:"Oregon",PA:"Pennsylvania",RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",TN:"Tennessee",TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming",DC:"District of Columbia",PR:"Puerto Rico",GU:"Guam",VI:"U.S. Virgin Islands",AS:"American Samoa",MP:"Northern Mariana Islands" };
const POS = { Y:["Yea","yea"], N:["Nay","nay"], P:["Present","p"], "-":["Not voting","nv"] };
const photo = id => `https://unitedstates.github.io/images/congress/225x275/${id}.jpg`;
const fmtDate = d => d ? new Date(d + "T12:00:00").toLocaleDateString(undefined, { month:"short", day:"numeric" }) : "";
const seat = m => m.chamber === "senate" ? `Senate, ${STATES[m.state] || m.state}` : `House, ${m.state}${m.district ? "-" + m.district : " at large"}`;

let MEMBERS = [], BY_ID = {}, VOTES = [], META = {}, ZIP = null;
const S = { zip: "", follows: [], mode: "passage", summary: true, quiet: false, pushToken: null, pushStatus: "unknown", tab: "today", view: null };
function loadState() { try { Object.assign(S, JSON.parse(localStorage.getItem("openchambers") || "{}")); } catch (e) {} S.view = null; }
function saveState() { try { localStorage.setItem("openchambers", JSON.stringify({ zip:S.zip, follows:S.follows, mode:S.mode, summary:S.summary, quiet:S.quiet, pushToken:S.pushToken, pushStatus:S.pushStatus, pushError:S.pushError })); } catch (e) {} }

async function loadData() {
  const [m, v, meta] = await Promise.all([fetch(DATA + "members.json").then(r => r.json()), fetch(DATA + "votes-index.json").then(r => r.json()).catch(() => []), fetch(DATA + "meta.json").then(r => r.json()).catch(() => ({}))]);
  MEMBERS = m; BY_ID = Object.fromEntries(m.map(x => [x.id, x])); VOTES = v; META = meta;
}
async function zipLookup(z) { if (!ZIP) ZIP = await fetch(DATA + "zip.json").then(r => r.json()); return ZIP[z] || null; }
const mvCache = {}; async function memberVotes(id) { return mvCache[id] ||= await fetch(`${DATA}members/${id}.json`).then(r => r.json()).then(j => j.votes).catch(() => []); }
const vCache = {}; async function voteDetail(id) { return vCache[id] ||= await fetch(`${DATA}votes/${id}.json`).then(r => r.json()).catch(() => null); }
async function repsForZip(z) {
  const cds = await zipLookup(z); if (!cds) return null;
  const states = [...new Set(cds.map(c => c.split("-")[0]))];
  const reps = cds.map(c => { const [st, d] = c.split("-"); return MEMBERS.find(m => m.chamber === "house" && m.state === st && (m.district || 0) === +d); }).filter(Boolean);
  const sens = MEMBERS.filter(m => m.chamber === "senate" && states.includes(m.state));
  return { cds, reps, sens, all: [...reps, ...sens] };
}

/* ===================== push (native only) ===================== */
const isNative = () => !!(window.CapPlugins && window.CapPlugins.Capacitor.isNativePlatform());
let pushListeners = false;
function ensurePushListeners() {
  if (pushListeners || !isNative()) return; pushListeners = true;
  const PN = window.CapPlugins.PushNotifications;
  PN.addListener("registration", async t => { S.pushToken = t.value; S.pushStatus = "on"; S.pushError = null; saveState(); await syncSubscription(); render(); });
  PN.addListener("registrationError", e => { S.pushStatus = "error"; S.pushError = String(e?.error || JSON.stringify(e)); saveState(); render(); });
  PN.addListener("pushNotificationActionPerformed", a => { const d = a.notification?.data || {}; if (d.voteId) { S.tab = "today"; S.view = { vote: d.voteId }; render(); } });
}
// Ask iOS what the permission really is right now, and register if it is granted.
// Runs at launch, whenever the app returns to the foreground, and after the user taps a button.
async function refreshPushStatus({ ask = false } = {}) {
  if (!isNative()) { S.pushStatus = "web"; return; }
  try {
    ensurePushListeners();
    const PN = window.CapPlugins.PushNotifications;
    let perm = await PN.checkPermissions();
    if (perm.receive === "prompt" && ask) perm = await PN.requestPermissions();
    const before = S.pushStatus;
    if (perm.receive === "granted") { await PN.register(); if (!S.pushToken) S.pushStatus = "registering"; }
    else if (perm.receive === "denied") { S.pushStatus = "denied"; }
    else { S.pushStatus = "unknown"; }
    if (S.pushStatus !== before) { saveState(); render(); }
  } catch (e) { S.pushStatus = "error"; S.pushError = String(e?.message || e); saveState(); render(); }
}
const setupPush = () => refreshPushStatus({ ask: true });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.zip && !S.step) refreshPushStatus(); });
async function syncSubscription() {
  if (!S.pushToken) return;
  try {
    if (!S.follows.length) { await fetch(API + "/v1/subscribe", { method: "DELETE", headers: { "content-type": "application/json" }, body: JSON.stringify({ token: S.pushToken }) }); return; }
    await fetch(API + "/v1/subscribe", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ token: S.pushToken, follows: S.follows, mode: S.mode, summary: S.summary, quiet: S.quiet }) });
  } catch (e) { console.warn("subscribe failed", e); }
}
function haptic() { try { if (isNative()) window.CapPlugins.Haptics.impact({ style: window.CapPlugins.ImpactStyle.Light }); } catch (e) {} }

/* ===================== components ===================== */
function photoEl(m, cls = "") { return `<img class="avatar ${cls}" src="${photo(m.id)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'avatar initials ${cls}',textContent:'${esc(m.first[0] + m.last[0])}'}))">`; }
function memberRow(m, right = "") { return `<div class="card row" data-member="${m.id}">${photoEl(m)}<div style="min-width:0"><div class="name">${esc(m.name)}</div><div class="meta"><span class="dot ${m.partyCode}"></span>${esc(m.party)} · ${esc(seat(m))}</div><div class="meta" style="color:var(--ink-3)">Next election ${m.nextElection}</div></div>${right}</div>`; }
function followToggle(m) { const on = S.follows.includes(m.id); return `<button class="toggle ${on ? "on" : ""}" data-follow="${m.id}" aria-label="Follow ${esc(m.name)}"></button>`; }
function voteCard(v, m, p) {
  const t = v.tally, tot = t.yea + t.nay + t.present + t.nv || 1;
  return `<div class="card" data-vote="${v.id}"><div class="row">${photoEl(m, "sm")}<div style="min-width:0"><div class="name" style="font-size:15px">${esc(m.name)} <span class="tag ${POS[p][1]}">${POS[p][0]}</span></div><div class="meta">${esc(v.question || "Vote")}${v.bill ? " · " + esc(v.bill) : ""}</div></div></div>
    <div class="vote" style="border:0;padding:8px 0 0"><div class="q">${esc(v.description || v.bill || "")}</div><div class="m">${v.chamber === "senate" ? "Senate" : "House"} · ${esc(v.result || "")} ${t.yea}–${t.nay} · ${fmtDate(v.date)}</div></div>
    <div class="bar"><i style="width:${t.yea / tot * 100}%;background:var(--yea)"></i><i style="width:${t.nay / tot * 100}%;background:var(--nay)"></i><i style="width:${(t.present + t.nv) / tot * 100}%;background:var(--nv)"></i></div></div>`;
}
const TAB_ICONS = {
  today: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="12" cy="15.5" r="1.6" fill="currentColor" stroke="none"/>',
  reps: '<circle cx="9" cy="8.5" r="3.4"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M15.5 5.6a3.4 3.4 0 0 1 0 5.8"/><path d="M17.5 13.9a6.5 6.5 0 0 1 4 6.1"/>',
  votes: '<path d="M4 6.5l1.6 1.6L8.5 5"/><path d="M11 6.5h9"/><path d="M4 12.5l1.6 1.6L8.5 11"/><path d="M11 12.5h9"/><path d="M4 18.5l1.6 1.6L8.5 17"/><path d="M11 18.5h9"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/><circle cx="12" cy="12" r="7"/>',
};
function tabbar() { return `<div class="tabbar">${[["today", "Today"], ["reps", "My reps"], ["votes", "All votes"], ["settings", "Settings"]].map(([k, l]) => `<button class="${S.tab === k ? "on" : ""}" data-tab="${k}" aria-label="${l}"><svg viewBox="0 0 24 24" aria-hidden="true">${TAB_ICONS[k]}</svg>${l}</button>`).join("")}</div>`; }

/* ===================== screens ===================== */

async function todayView() {

  const items = [];
  for (const m of followed) { const mv = await memberVotes(m.id); const pos = Object.fromEntries(mv); for (const v of VOTES) { if (pos[v.id] !== undefined) items.push({ v, m, p: pos[v.id] }); } }

  const today = new Date().toISOString().slice(0, 10), week = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
  const t = items.filter(i => i.v.date === today), w = items.filter(i => i.v.date < today && i.v.date >= week), older = items.filter(i => i.v.date < week);

  return `<div class="view"><div class="eyebrow" style="margin-top:4px">${new Date().toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" })}</div>
    <div class="h" style="font-size:24px;margin-top:0">${t.length ? `Your reps voted ${t.length} time${t.length === 1 ? "" : "s"} today` : "No votes from your reps today"}</div>${pushNote}

    ${items.length ? "" : `<div class="empty">${VOTES.length ? "Nothing recorded yet for the members you follow." : "Vote records load after the next nightly update."}</div>`}</div>${tabbar()}`;
}

      <div class="setting" style="color:var(--accent)" data-go="zip">Change ZIP code (${esc(S.zip)}) ›</div></div>
    <div class="eyebrow">Notifications</div><div class="card" style="padding:2px 14px">
      <div class="setting"><div>Status<small>${S.pushStatus === "on" ? "Alerts arrive on this iPhone" : S.pushStatus === "denied" ? "Turned off for Open Chambers in iPhone Settings" : S.pushStatus === "web" ? "Alerts arrive in the iPhone app" : "Alerts are not set up yet"}</small></div><b>${status}</b></div>${S.pushStatus === "error" && S.pushError ? `<div class="setting"><div class="meta" style="font-family:var(--mono);font-size:12px">${esc(S.pushError)}</div></div><div class="setting"><button class="btn ghost" data-go="push">Try again</button></div>` : ""}${S.pushStatus === "denied" ? `<div class="setting"><div class="meta">Open iPhone Settings › Notifications › Open Chambers and allow notifications.</div></div>` : ""}${S.pushStatus === "unknown" && isNative() ? `<div class="setting"><button class="btn ghost" data-go="push">Turn on notifications</button></div>` : ""}</div>
    <div class="eyebrow">About</div><div class="card"><div class="meta">Open Chambers shows the public record of Congress with no commentary. Members and votes come from the U.S. House Clerk, the Senate, and the unitedstates project; ideology scores from Voteview; bill summaries from the Congressional Research Service. Your ZIP stays on this phone; the alerts service stores only an anonymous notification token and the members you follow.</div>
      <div class="meta" style="margin-top:8px"><a href="https://johnhubert.llc/floor/#/about" target="_blank">Methodology</a> · <a href="https://johnhubert.llc/privacy.html" target="_blank">Privacy</a> · <a href="mailto:support@johnhubert.llc">Support</a>${META.builtAt ? ` · Data ${fmtDate(META.builtAt.slice(0, 10))}` : ""}</div></div></div>${tabbar()}`;
}

/* ===================== render + events ===================== */
let renderSeq = 0;
async function render() {
  const seq = ++renderSeq;
  let html;
  if (!S.zip || S.step === "zip") html = onboardingZip();
  else if (S.step === "reps") html = await onboardingReps();
  else if (S.tab === "today") html = await todayView();
  else if (S.tab === "reps") html = await repsView();
  else if (S.tab === "votes") html = await votesView();
  else html = settingsView();
  if (seq !== renderSeq) return;
  app.innerHTML = html;
  const zf = $("#zipform"); if (zf) zf.onsubmit = e => { e.preventDefault(); const z = $("#zip").value.trim(); if (/^\d{5}$/.test(z)) { S.zip = z; S.step = "reps"; saveState(); render(); } };
  if (S.view?.vote && $("#summary")) loadSummary(S.view.vote);
  if (S.view?.vote || S.view?.member) app.querySelector(".view")?.scrollTo(0, 0);
}
app.addEventListener("click", async e => {
  const t = e.target.closest("[data-follow],[data-tab],[data-vote],[data-member],[data-go],[data-back],[data-mode],[data-set],[data-ch]"); if (!t) return;
  if (t.dataset.follow) { const id = t.dataset.follow; S.follows = S.follows.includes(id) ? S.follows.filter(x => x !== id) : [...S.follows, id]; haptic(); saveState(); syncSubscription(); t.classList.toggle("on"); if (S.step === "reps") { const b = app.querySelector("[data-go=done]"); if (b) { b.disabled = !S.follows.length; b.textContent = S.follows.length ? "Turn on alerts" : "Pick at least one"; } } return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.view = null; render(); return; }
  if (t.dataset.vote) { S.view = { vote: t.dataset.vote }; render(); return; }
  if (t.dataset.member) { S.view = { member: t.dataset.member }; render(); return; }
  if (t.dataset.back !== undefined) { S.view = null; render(); return; }
  if (t.dataset.mode) { S.mode = t.dataset.mode; saveState(); syncSubscription(); app.querySelectorAll("#mode button").forEach(b => b.classList.toggle("on", b === t)); return; }
  if (t.dataset.ch !== undefined) { S.view = { chamber: t.dataset.ch }; render(); return; }
  if (t.dataset.set) { const [k, val] = t.dataset.set.split(":"); if (k === "mode") S.mode = val; else S[k] = !S[k]; saveState(); haptic(); await syncSubscription(); render(); return; }
  if (t.dataset.go === "zip") { S.step = "zip"; S.view = null; render(); return; }
  if (t.dataset.go === "done") { S.step = null; S.tab = "today"; saveState(); render(); await setupPush(); await syncSubscription(); render(); return; }
  if (t.dataset.go === "push") { await setupPush(); await syncSubscription(); render(); return; }
});
window.addEventListener("hashchange", () => { const m = location.hash.match(/#\/vote\/([\w-]+)/); if (m) { S.tab = "today"; S.view = { vote: m[1] }; render(); } });

(async () => {
  loadState();
  try { await loadData(); } catch (e) { app.innerHTML = `<div class="view"><div class="empty">Couldn't reach the data (${esc(e.message)}). Check your connection and reopen.</div></div>`; return; }
  if (S.zip && !S.step) refreshPushStatus(); // real permission + re-register on every launch
  render();
})();
</script>
</body>
</html>
