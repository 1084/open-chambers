name: ios-release
# Builds the iPhone app on a macOS runner (Xcode 26), signs it, and uploads it to App Store Connect.
# The build then appears in TestFlight after Apple processes it (5–15 min).
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   IOS_P12_BASE64       Apple Distribution certificate + private key, .p12 exported from Keychain Access, base64
#   IOS_P12_PASSWORD     password chosen when exporting the .p12
#   IOS_PROFILE_BASE64   App Store provisioning profile (.mobileprovision) for com.johnhubert.openchambers, base64
#   ASC_KEY_ID           App Store Connect API key id (10 chars)
#   ASC_ISSUER_ID        App Store Connect API issuer id (uuid)
#   ASC_KEY_BASE64       the API key .p8 file, base64
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ios-release.yaml"]
concurrency: { group: ios-release, cancel-in-progress: false }
env:
  TEAM_ID: 744F7V77PD
  BUNDLE_ID: com.johnhubert.openchambers
  PROFILE_NAME: Open Chambers
  MARKETING_VERSION: "1.0"
jobs:
  build:
    runs-on: macos-latest   # macOS 26 arm64 image (has Xcode 26)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Web assets + Capacitor sync
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npm run prepare-www
          npx cap sync ios
      - name: Import signing certificate and profile
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -e
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KPASS=$(uuidgen)
          security create-keychain -p "$KPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPASS" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KPASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; echo "$PROFILE_BASE64" | base64 --decode > "$d/openchambers.mobileprovision"
          done
          rm -f $RUNNER_TEMP/cert.p12
      - name: API key for upload
        env: { ASC_KEY_BASE64: "${{ secrets.ASC_KEY_BASE64 }}", ASC_KEY_ID: "${{ secrets.ASC_KEY_ID }}" }
        run: |
          mkdir -p $RUNNER_TEMP/keys
          echo "$ASC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Archive
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/App.xcarchive archive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -skipPackagePluginValidation -skipMacroValidation | tail -40
      - name: Export and upload to App Store Connect
        env: { ASC_KEY_ID: "${{ secrets.ASC_KEY_ID }}", ASC_ISSUER_ID: "${{ secrets.ASC_ISSUER_ID }}" }
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -30
          echo "Uploaded build ${{ github.run_number }} (version $MARKETING_VERSION). Check TestFlight in 5–15 minutes."
      - name: Clean up
        if: always()
        run: rm -rf $RUNNER_TEMP/keys $RUNNER_TEMP/build.keychain-db
